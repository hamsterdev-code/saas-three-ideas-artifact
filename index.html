Ядро: комбинация дешёвого HTTP-check и дорогих Playwright-прогонов по заранее заданным сценариям (открыть страницу → клик → проверить элемент/текст/URL). Алерты в Telegram. При падении — AI-слой: гипотеза причины + черновик сообщения клиенту.

Это не «ещё один UptimeRobot». Это synthetic monitoring с RU/Telegram UX и упором на бизнес-пути (заявка, checkout), а не только на доступность хоста.

Платит одна сторона — студия или владелец сайта.`,differentiation:{pingProblem:`Классический мониторинг дергает URL и смотрит статус/время ответа. Сайт может отдавать 200 на главной, пока /cart, форма заявки или thank-you page уже сломаны. Для студии это худший сценарий: клиент пишет первым.`,ourApproach:`Частый лёгкий HTTP-check + реже Playwright по 3–10 критическим сценариям. При fail — скриншот, лог шага, AI-краткий разбор и текст для клиента в Telegram. ИИ вызывается на инцидентах, не на каждом успешном прогоне.`,offerLine:`UptimeRobot/Tracker скажут «сайт жив». SitePulse скажет «кнопка Купить умерла» — и даст черновик ответа клиенту в Telegram.`,switchReasons:[`Ловите ложно-зелёные 200 OK на бизнес-путях (корзина, форма, оплата)`,`Студия узнаёт о поломке раньше клиента и выглядит профессионально`,`Готовые сценарии без написания Playwright-кода заказчиком`,`Telegram-native workflow + AI-черновик коммуникации`,`Чек сопоставим с Pingera (от ~1.8k ₽), но проще для студийного ICP`]},forWhom:[`Веб-студии с 10–80 клиентскими сайтами (формы/Tilda/магазины)`,`E-com и лендинги, где конверсия = деньги`,`SaaS с критическим signup/checkout flow`,`Команды, которым пинга уже мало, а Datadog/Checkly — тяжело и дорого`],notFor:[`Хобби-сайт «лишь бы открывался» — хватит бесплатного пинга`,`Enterprise APM/observability (другой бюджет и buyer)`,`Сценарии с SMS/капчей/сложной 2FA без тестового контура`],example:{title:`Студия: 24 лендинга клиентов`,story:`Главные страницы зелёные в UptimeRobot. У клиента #7 сломалась форма заявки после правки в Tilda Zero Block.`,before:`Пинг зелёный 6 часов. Клиент: «почему лиды не приходят?». Студия в реактивном режиме, доверие падает.`,after:`Playwright-сценарий «открыть → заполнить форму → увидеть success» падает через 10–15 мин. Telegram: шаг, скрин, AI-черновик клиенту. Чинят до эскалации.`},flow:[{step:`Подключить сайт и Telegram`,detail:`Проект студии, чат дежурных, список URL клиентов.`},{step:`Выбрать сценарии`,detail:`Шаблоны: форма, корзина, thank-you, login smoke. Без кода — параметры селекторов/ожидаемого текста.`},{step:`Двухслойный мониторинг`,detail:`HTTP часто (дёшево). Playwright реже (например раз в 10–15 мин) по критическим путям.`},{step:`Инцидент`,detail:`Fail шага → скрин + trace → AI-гипотеза → сообщение в TG (факт + черновик клиенту).`},{step:`Отчёт студии`,detail:`Недельный uptime по сценариям — можно переслать клиенту как доказательство контроля.`}],featuresMvp:[`HTTP(S) checks + Telegram DOWN/UP`,`1–5 Playwright-сценариев из шаблонов`,`Скриншот и имя упавшего шага`,`Антифлап (N фейлов подряд)`,`AI-черновик только на confirmed incident`,`Лимиты по числу сценариев/частоте (контроль себестоимости)`],featuresLater:[`Конструктор шагов drag-and-drop`,`Мульти-регион браузерных проверок`,`White-label отчёты`,`Сравнение визуальное (pixel diff) опционально`,`Импорт готовых Playwright-скриптов для технарей`],evidence:[{claim:`За Playwright/browser monitoring платят отдельно от пинга`,figure:`Checkly Detect Starter от $24/мес (annual) с browser/Playwright runs`,url:`https://www.checklyhq.com/pricing/`,note:`Официальный прайс Checkly`},{claim:`Облачный headless-браузер — отдельный платный рынок`,figure:`Browserless от $25/мес (Prototyping, annual billing)`,url:`https://www.browserless.io/pricing`,note:`Unit ≈ до 30 сек браузерного времени`},{claim:`В РФ уже продают Playwright synthetic`,figure:`Pingera Pro от 1 800 ₽/мес; synthetic = 10 кредитов/запуск`,url:`https://pingera.ru/prices`,note:`Прямой RU-компаратор по классу продукта`},{claim:`Pingera явно использует Playwright для synthetic`,figure:`Документация: скрипты Playwright, скриншоты, user-like interaction`,url:`https://docs.pingera.ru/checks/overview`,note:`Официальная дока`},{claim:`Простой пинг в РФ дешёвый — им не конкурировать ценой`,figure:`Tracker.ru: Free / Basic 290 ₽ / Pro 790 ₽`,url:`https://tracker.ru/pricing`,note:`Ценовой якорь «просто uptime»`},{claim:`Массовый спрос на uptime-категорию существует`,figure:`UptimeRobot: 3.3M+ users, ~7.57M monitors`,url:`https://uptimerobot.com/advanced-features/`,note:`Официальные заявления вендора; выручка не audited`},{claim:`AI-разбор инцидента дёшев при вызове только на fail`,figure:`GPT-4o mini ≈ $0.15 / $0.60 за 1M input/output tokens`,url:`https://developers.openai.com/api/docs/models/gpt-4o-mini`,note:`Один разбор инцидента — доли цента`},{claim:`Категория synthetic monitoring крупная (оценки расходятся)`,figure:`Precedence: ~$1.48B в 2025 (агентская оценка рынка)`,url:`https://www.precedenceresearch.com/synthetic-monitoring-market`,note:`Вторичный market report, не ваша выручка`}],competitors:[{name:`UptimeRobot`,url:`https://uptimerobot.com/`,region:`Global`,threat:`эталон рынка`,what:`Массовый uptime: HTTP/ping/SSL/keyword. Не замена Playwright-сценариям checkout.`,pricing:`Free + Solo/Team/Enterprise (от ~$7–10 Solo по публичному pricing)`,users:`3.3M+ users / ~7.57M monitors (официально на сайте)`,revenue:`Не раскрыто; сторонние оценки конфликтуют`,usersConfidence:`официально`,revenueConfidence:`вторичная оценка`,whyMatters:`Бесплатный якорь «сайт пингуется» — главный анти-оффер к дешёвому тарифу`,vsYou:`Не конкурировать числом мониторов. Бить ложно-зелёные бизнес-пути + TG/AI для студий`},{name:`Checkly`,url:`https://www.checklyhq.com/`,region:`Global`,threat:`прямой`,what:`Synthetic monitoring as code: API + Playwright browser checks / suites`,pricing:`Hobby free; Detect Starter ~$24/mo annual; Team ~$64/mo annual`,users:`Публичного audited user count в открытых первоисточниках мало`,revenue:`Не раскрыто`,usersConfidence:`не раскрыто`,revenueConfidence:`не раскрыто`,whyMatters:`Доказывает willingness to pay за browser checks`,vsYou:`Сильнее для dev-команд с кодом в репо. Слабее для RU-студии без Playwright-инженера`},{name:`Pingera`,url:`https://pingera.ru/`,region:`RU`,threat:`прямой`,what:`RU-платформа: uptime + synthetic Playwright + status pages, кредитная модель`,pricing:`Free; Pro от 1 800 ₽ (Про-5) до 40 000 ₽; Corp от 50 000 ₽`,users:`Не раскрыто`,revenue:`Не раскрыто`,usersConfidence:`не раскрыто`,revenueConfidence:`не раскрыто`,whyMatters:`Самый близкий RU-конкурент по Playwright`,vsYou:`Дифференциация: no-code шаблоны для студий, TG+AI communication layer, пакетный прайс без кредитной каши`},{name:`Tracker.ru`,url:`https://tracker.ru/`,region:`RU`,threat:`косвенный`,what:`Дешёвый RU uptime + Telegram/MAX, скриншоты на верхних тарифах — не полный user journey`,pricing:`0 / 290 / 790 ₽`,users:`Не раскрыто`,revenue:`Не раскрыто`,usersConfidence:`не раскрыто`,revenueConfidence:`не раскрыто`,whyMatters:`Ценовой пол для «просто алерт»`,vsYou:`Ваш чек 2–5k должен объясняться сценариями+AI, иначе выглядите дорого`},{name:`Better Stack`,url:`https://betterstack.com/`,region:`Global`,threat:`косвенный`,what:`Uptime + on-call + telemetry; AI SRE в линейке`,pricing:`Free + ~$29/responder annual + packs`,users:`Press: 200k+ developers, 4k+ customers`,revenue:`Оценки ~$3–6M ARR (вторично)`,usersConfidence:`официально`,revenueConfidence:`вторичная оценка`,whyMatters:`Рынок уходит в incident+AI`,vsYou:`Другой buyer и чек; для Tilda-студии избыточно`},{name:`SDdetector`,url:`https://sddetector.ru/`,region:`RU`,threat:`прямой`,what:`RU uptime + заявленный AI-разбор инцидентов`,pricing:`от 200 ₽; AI на mid-тарифах (~490+)`,users:`Не раскрыто`,revenue:`Не раскрыто`,usersConfidence:`не раскрыто`,revenueConfidence:`не раскрыто`,whyMatters:`AI-слоган в RU уже занят`,vsYou:`Нужен факт Playwright-сценария + проверяемый вывод, не маркетинговое «есть AI»`},{name:`Uptime Kuma`,url:`https://github.com/louislam/uptime-kuma`,region:`Self-host`,threat:`косвенный`,what:`Бесплатный self-hosted uptime`,pricing:`ПО бесплатно + VPS`,users:`Очень высокая GitHub-популярность (число stars меняется)`,revenue:`Не SaaS`,usersConfidence:`официально`,revenueConfidence:`не раскрыто`,whyMatters:`Альтернатива «сделаю сам» для технарей`,vsYou:`Студии без админа платят за облако и сценарии`}],entryWithAi:{difficulty:`Технически MVP реален за 2–4 недели. Коммерчески — средне: Playwright в категории уже есть, пинг дёшев, AI не уникален как слово.`,summary:`Вход возможен, если продукт = synthetic для студий + Telegram/AI communication, а не «мы тоже пингуем с нейросетью». Себестоимость держится на self-hosted Playwright и AI-only-on-fail. 20к ₽ MRR — это 5–10 клиентов, не «доля UptimeRobot».`,easy:[`Готовность платить за browser checks доказана Checkly/Pingera/Browserless`,`Боль «ложно-зелёный сайт» понятна студиям без объяснения теории`,`AI на fail почти не бьёт по марже`,`Цель 20к ₽ достижима малым числом аккаунтов`],hard:[`Pingera уже в РФ с Playwright`,`Хрупкость селекторов → ложные алерты → churn`,`Антиботы/Cloudflare`,`Нужны продажи: 8 студий сами не придут`],verdict:`Проект экономически жизнеспособен как micro-SaaS. Успех = ICP (студии) + надёжные шаблоны сценариев + честный оффер против пинга. AI — усилитель, не фундамент.`},pathTo20k:{summary:`20 000 ₽ MRR — операционная, не фантастическая цель. Нужно 5–10 платящих на чеке 2–4k ₽. «Быстро» = недели продаж после рабочего MVP, не гарантия.`,math:[{label:`Вариант A`,calc:`8 × 2 500 ₽ = 20 000 ₽`},{label:`Вариант B`,calc:`5 × 4 000 ₽ = 20 000 ₽`},{label:`Вариант C`,calc:`10 × 2 000 ₽ = 20 000 ₽`},{label:`Компаратор рынка`,calc:`Pingera Pro-5 = 1 800 ₽ — ваш чек 2–5k рядом, если видна разница в оффере`}],timeline:[`Недели 1–2: HTTP + 1–2 Playwright-шаблона + Telegram`,`Недели 3–4: биллинг, лимиты, AI-on-fail, лендинг с демо-скрином`,`Недели 5–8: 10–20 разговоров со студиями, 5–10 платящих пилотов`,`Не считать «быстро», если нет outreach — продукт сам 20к не наберёт`],caveats:[`Математика ≠ прогноз вашей скорости закрытия сделок`,`Пилоты бесплатно 14 дней без конверсии в оплату — ложный прогресс`,`Один крупный клиент на 20k хрупче, чем 8 средних`]},unitModel:{principle:`Дешёвое часто, дорогое редко: HTTP часто; Playwright по критическим путям; AI только на confirmed fail.`,tariffExample:`Студия 2 490 ₽: до 5 Playwright-сценариев, интервал 10 мин, HTTP отдельно, AI-черновики на инцидентах.`,runsPerCustomer:`5 сценариев × 6 раз/час × 24 × 30 ≈ 21 600 browser-runs/мес на клиента. 8 клиентов ≈ 173k runs/мес.`,selfHost:[`Свой Playwright на VPS — основной путь к марже на старте`,`Ориентир железа: 2–4+ GB RAM под Chromium; бюджет порядка тысяч ₽/мес на старте (Hetzner/аналоги, цены плавают)`,`Очередь задач + лимит concurrency, иначе OOM`],cloudBrowser:[`Browserless: unit ≈ 30 сек; Prototyping $25 / 20k units; Starter $140 / 180k`,`При ~170k runs/мес облако легко съедает большую часть выручки 20k ₽`,`Облако — запасной путь, не дефолт для unit-экономики соло`],aiCost:[`GPT-4o mini: ~$0.15 / $0.60 за 1M in/out`,`100 инцидентов/мес ≈ порядка $1 или меньше`,`Запрещённый паттерн: LLM на каждый успешный check`],marginAt20k:[`Выручка 20 000 ₽`,`Инфра ~2–5 000 ₽ (self-host)`,`AI ~50–300 ₽`,`Грубая маржа до своего времени: ~14–17 000 ₽`]},pricing:[{plan:`Старт`,price:`1 990 ₽/мес`,includes:`1 сайт · 2 сценария · 15 мин · TG`},{plan:`Студия`,price:`2 490–3 490 ₽/мес`,includes:`до 15 URL · 5 сценариев · 10 мин · AI-on-fail`},{plan:`Агентство`,price:`4 990 ₽/мес`,includes:`больше URL/сценариев · отчёты · приоритет`}],unitEconomics:[`Не продавать безлимитный Playwright «как пинг» — иначе убыток`,`Лимитировать сценарии и interval в тарифе`,`Self-host browser workers; cloud BaaS только как overflow`,`AI строго на fail + кэш типовых ответов`,`Целиться в ARPU ≥ 2k ₽, иначе CAC студий не отобьётся`],goToMarket:[`Прямые продажи студиям: демо «форма жива / форма мертва»`,`Контраст с их текущим UptimeRobot/Tracker на реальном клиентском URL`,`SEO: «мониторинг формы сайта», «проверка корзины», «playwright мониторинг»`,`Пилот 14 дней на 1–2 критических сценария → перевод на Студию`],cons:[`Себестоимость и сложность выше, чем у HTTP-пинга`,`В РФ уже есть Pingera с Playwright — вы не изобретаете категорию`,`Глобально Checkly/Datadog/Pingdom synthetic — сильные игроки`,`Селекторы и вёрстка меняются → ложные алерты и поддержка сценариев`,`А
